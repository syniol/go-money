name: Bench

on:
  # Nightly at 03:00 UTC so the numbers stay honest against upstream changes.
  schedule:
    - cron: '0 3 * * *'
  # Manual dispatch for on-demand runs after a perf-affecting merge.
  workflow_dispatch:

jobs:
  compare:
    name: Comparison benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.24.x

    - name: Check out code
      uses: actions/checkout@v4

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-bench-${{ hashFiles('benchmarks/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-bench-

    - name: Download benchmark deps
      working-directory: benchmarks
      run: go mod download

    - name: Run comparison benchmarks
      working-directory: benchmarks
      run: go test -bench=. -benchmem -run=^$ -benchtime=3s -count=1 | tee bench.out

    - name: Upload bench output
      uses: actions/upload-artifact@v4
      with:
        name: bench-output-${{ github.run_id }}
        path: benchmarks/bench.out
        retention-days: 30
